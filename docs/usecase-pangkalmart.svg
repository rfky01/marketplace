<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #fff; }
      .system { fill: #f8fbff; stroke: #111827; stroke-width: 3; }
      .title-box { fill: #fff; stroke: #111827; stroke-width: 2; }
      .title { font-family: "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .section { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #334155; letter-spacing: .6px; }
      .actor-text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .usecase { fill: #fff; stroke: #111827; stroke-width: 2; }
      .usecase-text { font-family: "Times New Roman", serif; font-size: 20px; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .usecase-small { font-family: "Times New Roman", serif; font-size: 18px; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #111827; stroke-width: 2; fill: none; }
      .include { stroke: #111827; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .include-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .service { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .service-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #7c2d12; text-anchor: middle; dominant-baseline: middle; }
      .note { fill: #eef2ff; stroke: #c7d2fe; }
      .note-text { font-family: Arial, sans-serif; font-size: 15px; fill: #3730a3; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#111827" stroke-width="2"/>
    </marker>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#fff" stroke="#111827" stroke-width="2"/>
    </marker>
  </defs>

